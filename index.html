<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডিজিটাল তসবি কাউন্টার (IndexedDB সহ)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0fdf4;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .card-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 350px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .dua-select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #16a34a;
      outline: none;
      margin-bottom: 10px;
      background-color: #f8fafc;
      font-weight: bold;
    }

    .count-display {
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-count {
      background-color: #16a34a;
      color: white;
      font-size: 22px;
      padding: 18px;
    }

    .btn-reset {
      background-color: #ef4444;
      color: white;
    }

    .btn-history {
      background-color: #0284c7;
      color: white;
    }

    .history-card {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 350px;
      display: none;
    }

    .history-card h3 {
      margin-bottom: 10px;
      font-size: 18px;
      text-align: center;
    }

    .history-list {
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }

    .date-header {
      background-color: #f1f5f9;
      padding: 6px 10px;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 14px;
    }

    .dua-item {
      padding: 6px 15px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      border-bottom: 1px dashed #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="card-container" id="card-container">
    <h1>ডিজিটাল তসবি</h1>

    <select id="dua-select" class="dua-select">
      <option value="সুবহানআল্লাহ">সুবহানআল্লাহ (Subhanallah)</option>
      <option value="আলহামদুলিল্লাহ">আলহামদুলিল্লাহ (Alhamdulillah)</option>
      <option value="আল্লাহু আকবার">আল্লাহু আকবার (Allahu Akbar)</option>
      <option value="আস্তাগফিরুল্লাহ">আস্তাগফিরুল্লাহ (Astaghfirullah)</option>
      <option value="দরূদ শরীফ">দরূদ শরীফ (Durood)</option>
    </select>

    <div class="count-display" id="count-display">0</div>

    <div class="btn-group">
      <button class="btn-count" id="count-btn">Count (+1)</button>
      <button class="btn-reset" id="reset-btn">Reset (নতুন জিকির)</button>
      <button class="btn-history" id="history-btn">📊 হিস্ট্রি দেখুন</button>
    </div>
  </div>

  <div class="history-card" id="history-card">
    <h3>পড়ার হিস্ট্রি (ডাটাবেজে সেভড)</h3>
    <div class="history-list" id="history-list"></div>
  </div>

  <script>
    let count = 0;
    let db;

    const countDisplay = document.getElementById("count-display");
    const countBtn = document.getElementById("count-btn");
    const resetBtn = document.getElementById("reset-btn");
    const historyBtn = document.getElementById("history-btn");
    const cardContainer = document.getElementById("card-container");
    const historyCard = document.getElementById("history-card");
    const historyList = document.getElementById("history-list");
    const duaSelect = document.getElementById("dua-select");

    const clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

    function getTodayDate() {
      const today = new Date();
      return today.toLocaleDateString('en-GB');
    }

    // 🗄️ IndexedDB ডাটাবেজ ওপেন করা
    const dbRequest = indexedDB.open("TasbeehDatabase", 1);

    dbRequest.onupgradeneeded = function(event) {
      db = event.target.result;
      if (!db.objectStoreNames.contains("history")) {
        db.createObjectStore("history", { keyPath: "id" });
      }
    };

    dbRequest.onsuccess = function(event) {
      db = event.target.result;
    };

    dbRequest.onerror = function(event) {
      console.error("Database error:", event.target.errorCode);
    };

    // 💾 IndexedDB তে সেভ করা
    function saveToIndexedDB(date, dua) {
      if (!db) return;
      const transaction = db.transaction(["history"], "readwrite");
      const store = transaction.objectStore("history");
      const id = `${date}_${dua}`;

      const request = store.get(id);

      request.onsuccess = function() {
        let currentCount = request.result ? request.result.count : 0;
        store.put({ id: id, date: date, dua: dua, count: currentCount + 1 });
      };
    }

    // 📊 IndexedDB থেকে হিস্ট্রি লোড করা
    function renderHistoryFromDB() {
      if (!db) return;
      historyList.innerHTML = "";

      const transaction = db.transaction(["history"], "readonly");
      const store = transaction.objectStore("history");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = function() {
        const records = getAllRequest.result;

        if (records.length === 0) {
          historyList.innerHTML = "<p style='text-align:center; padding:10px;'>কোনো হিস্ট্রি পাওয়া যায়নি</p>";
          return;
        }

        // তারিখ অনুযায়ী ডাটা গ্রুপ করা
        let grouped = {};
        records.forEach(item => {
          if (!grouped[item.date]) grouped[item.date] = [];
          grouped[item.date].push(item);
        });

        for (let date in grouped) {
          let dateHeader = document.createElement("div");
          dateHeader.className = "date-header";
          dateHeader.innerText = `📅 ${date}`;
          historyList.appendChild(dateHeader);

          grouped[date].forEach(item => {
            let duaItem = document.createElement("div");
            duaItem.className = "dua-item";
            duaItem.innerHTML = `<span>✨ ${item.dua}</span> <strong>${item.count} বার</strong>`;
            historyList.appendChild(duaItem);
          });
        }
      };
    }

    countBtn.addEventListener("click", function() {
      count = count + 1;
      countDisplay.innerText = count;

      let todayDate = getTodayDate();
      let selectedDua = duaSelect.value;

      saveToIndexedDB(todayDate, selectedDua);

      let lastTwoDigits = count % 100;
      if (lastTwoDigits === 33 || lastTwoDigits === 66 || lastTwoDigits === 99) {
        clickSound.play();
        cardContainer.style.backgroundColor = "#22c55e";
        cardContainer.style.color = "#ffffff";
      } else {
        cardContainer.style.backgroundColor = "#ffffff";
        cardContainer.style.color = "#000000";
      }
    });

    resetBtn.addEventListener("click", function() {
      count = 0;
      countDisplay.innerText = count;
      cardContainer.style.backgroundColor = "#ffffff";
      cardContainer.style.color = "#000000";
    });

    duaSelect.addEventListener("change", function() {
      count = 0;
      countDisplay.innerText = count;
      cardContainer.style.backgroundColor = "#ffffff";
      cardContainer.style.color = "#000000";
    });

    historyBtn.addEventListener("click", function() {
      if (historyCard.style.display === "block") {
        historyCard.style.display = "none";
      } else {
        historyCard.style.display = "block";
        renderHistoryFromDB();
      }
    });
  </script>

</body>
</html>
