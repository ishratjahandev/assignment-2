<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Tasbeeh Counter 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* 🌸 Dreamy Pastel Gradient Background */
      background: linear-gradient(135deg, #fce7f3, #f3e8ff, #e0e7ff);
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      color: #475569;
    }

    /* 📿 Digital Finger Tasbeeh Shape Body */
    .card-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 140px 140px 100px 100px;
      padding: 35px 24px 30px;
      width: 100%;
      max-width: 290px;
      height: 460px;
      text-align: center;
      border: 3px solid #fbcfe8;
      box-shadow: 
        0 20px 40px rgba(244, 114, 182, 0.15),
        0 10px 20px rgba(0, 0, 0, 0.05),
        inset 0 -10px 15px rgba(251, 207, 232, 0.3);
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 🎀 Top Strap Holder */
    .card-container::before {
      content: '';
      position: absolute;
      top: -16px;
      width: 90px;
      height: 18px;
      background: #fbcfe8;
      border-radius: 10px 10px 0 0;
      border: 2px solid #f472b6;
      border-bottom: none;
    }

    /* 🎀 Bottom Finger Strap Slot */
    .card-container::after {
      content: '';
      position: absolute;
      bottom: -20px;
      width: 110px;
      height: 22px;
      background: #fbcfe8;
      border-radius: 0 0 12px 12px;
      border: 2px solid #dc4794;
      border-top: none;
    }

    .card-container.milestone-active {
      box-shadow: 0 0 35px rgba(244, 114, 182, 0.5);
      border-color: #f472b6;
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      font-weight: 600;
      color: #ec4899;
      margin-top: 5px;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(236, 72, 153, 0.15);
    }

    /* 💖 Soft Rounded Select Dropdown */
    .dua-select {
      width: 90%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 16px;
      border: 2px solid #fbcfe8;
      outline: none;
      background: #fff5f8;
      color: #db2777;
      cursor: pointer;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(244, 114, 182, 0.08);
      transition: all 0.2s ease;
      text-align: center;
    }

    .dua-select:hover {
      border-color: #f472b6;
    }

    /* 🌸 Cute Glowing Display Screen */
    .screen-wrapper {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, #fff1f2, #f3e8ff);
      border-radius: 20px;
      padding: 12px 10px;
      margin-bottom: 16px;
      border: 2px dashed #f472b6;
      box-shadow: inset 0 4px 10px rgba(244, 114, 182, 0.1);
    }

    .count-display {
      font-family: 'Fredoka', cursive;
      font-size: 58px;
      font-weight: 700;
      color: #e72a88;
      text-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
      line-height: 1;
      user-select: none;
      transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .count-display.pop {
      transform: scale(1.15);
    }

    /* 🌸 Main Action Area */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
    }

    /* ❤️ Red Colored Main Counter Button */
    .btn-count {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: linear-gradient(135deg, #d663d6, #be4f8a);
      color: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 
        0 10px 25px rgba(225, 29, 72, 0.4),
        inset 0 4px 6px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-count:active {
      transform: scale(0.90);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
    }

    /* ⚙️ Sub-Buttons Placed BELOW the Count Button */
    .sub-btn-group {
      display: flex;
      width: 90%;
      justify-content: space-between;
      gap: 12px;
    }

    button.sub-btn {
      flex: 1;
      border: none;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }

    button.sub-btn:active {
      transform: scale(0.95);
    }

    .btn-reset {
      color: #ef4444;
      background: #fee2e2;
    }

    .btn-reset:hover {
      background: #fecaca;
    }

    .btn-history {
      color: #a855f7;
      background: #f3e8ff;
    }

    .btn-history:hover {
      background: #e9d5ff;
    }

    /* 📊 Cute History Card */
    .history-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 290px;
      border: 2px solid #fbcfe8;
      box-shadow: 0 10px 25px rgba(244, 114, 182, 0.12);
      display: none;
    }

    .history-card h3 {
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      text-align: center;
      color: #ec4899;
      margin-bottom: 12px;
    }

    .history-list {
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
    }

    .history-list::-webkit-scrollbar {
      width: 5px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 10px;
    }

    .date-header {
      background: #fff5f8;
      padding: 6px 12px;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 12px;
      color: #db2777;
    }

    .dua-item {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px dashed #fbcfe8;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 4px;
      color: #475569;
      transition: background 0.2s;
    }

    .dua-item:hover {
      background: #fce7f3;
      color: #db2777;
    }

    /* 🎀 Cute Custom Modal Popup UI */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(71, 85, 105, 0.4);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 20px;
      width: 85%;
      max-width: 270px;
      text-align: center;
      border: 3px solid #fbcfe8;
      box-shadow: 0 15px 35px rgba(244, 114, 182, 0.25);
      transform: scale(0.8);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .modal-box h4 {
      font-family: 'Fredoka', cursive;
      font-size: 17px;
      color: #db2777;
      margin-bottom: 6px;
    }

    .modal-box p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    .modal-btn-yes {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .modal-btn-no {
      background: #f1f5f9;
      color: #64748b;
    }

    .modal-btn-no:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="card-container" id="card-container">
    <h1>Tasbeeh counter 🌸</h1>

    <select id="dua-select" class="dua-select">
      <option value="Subhanallah">Subhanallah ✨</option>
      <option value="Alhamdulillah">Alhamdulillah 💖</option>
      <option value="Allahu Akbar">Allahu Akbar 🌟</option>
      <option value="Astaghfirullah">Astaghfirullah 🌿</option>
      <option value="Durood">Durood 🌺</option>
    </select>

    <div class="screen-wrapper">
      <div class="count-display" id="count-display">0</div>
    </div>

    <div class="btn-group">
      <!-- Main Heart/Tap Button -->
      <button class="btn-count" id="count-btn">TAP 💕</button>

      <!-- Sub-Buttons (Placed Below) -->
      <div class="sub-btn-group">
        <button class="sub-btn btn-reset" id="reset-btn">↺ Reset</button>
        <button class="sub-btn btn-history" id="history-btn">📊 History</button>
      </div>
    </div>
  </div>

  <div class="history-card" id="history-card">
    <h3>History Logs 🌸</h3>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- 🌸 Cute Modal Popup Overlay -->
  <div class="modal-overlay" id="custom-modal">
    <div class="modal-box">
      <div class="modal-icon">🌸</div>
      <h4>Reset Counter?</h4>
      <p>Are you sure you want to reset the current screen count to 0?</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-no" id="modal-cancel">No</button>
        <button class="modal-btn modal-btn-yes" id="modal-confirm">Yes</button>
      </div>
    </div>
  </div>

  <script>
    let count = 0;

    const countDisplay = document.getElementById("count-display");
    const countBtn = document.getElementById("count-btn");
    const resetBtn = document.getElementById("reset-btn");
    const historyBtn = document.getElementById("history-btn");
    const cardContainer = document.getElementById("card-container");
    const historyCard = document.getElementById("history-card");
    const historyList = document.getElementById("history-list");
    const duaSelect = document.getElementById("dua-select");

    // Custom Modal Elements
    const customModal = document.getElementById("custom-modal");
    const modalConfirm = document.getElementById("modal-confirm");
    const modalCancel = document.getElementById("modal-cancel");

    const clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

    function getTodayDate() {
      const today = new Date();
      return today.toLocaleDateString('en-GB');
    }

    function getStoredHistory() {
      try {
        const data = localStorage.getItem("tasbeehDuaHistory");
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }

    function saveHistory(historyData) {
      try {
        localStorage.setItem("tasbeehDuaHistory", JSON.stringify(historyData));
      } catch (e) {
        console.error("Save error", e);
      }
    }

    function loadCurrentDuaCount() {
      let todayDate = getTodayDate();
      let selectedDua = duaSelect.value;
      let savedHistory = getStoredHistory();

      if (savedHistory[todayDate] && savedHistory[todayDate][selectedDua]) {
        count = savedHistory[todayDate][selectedDua];
      } else {
        count = 0;
      }
      countDisplay.innerText = count;
      resetCardStyle();
    }

    function resetCardStyle() {
      cardContainer.classList.remove("milestone-active");
    }

    loadCurrentDuaCount();

    countBtn.addEventListener("click", function() {
      count = count + 1;
      countDisplay.innerText = count;

      // Pop Animation
      countDisplay.classList.add("pop");
      setTimeout(() => countDisplay.classList.remove("pop"), 80);

      let todayDate = getTodayDate();
      let selectedDua = duaSelect.value;
      let savedHistory = getStoredHistory();

      if (!savedHistory[todayDate]) {
        savedHistory[todayDate] = {};
      }

      // হিস্ট্রিতে ডাটা সবসময় জমা হতে থাকবে
      savedHistory[todayDate][selectedDua] = count;
      saveHistory(savedHistory);

      let lastTwoDigits = count % 100;
      if (lastTwoDigits === 33 || lastTwoDigits === 66 || lastTwoDigits === 99) {
        clickSound.play();
        cardContainer.classList.add("milestone-active");

        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      } else {
        resetCardStyle();
      }
    });

    duaSelect.addEventListener("change", function() {
      loadCurrentDuaCount();
    });

    // 🌸 Open Cute Modal Popup on Reset Click
    resetBtn.addEventListener("click", function() {
      customModal.classList.add("active");
    });

    // Handle "Yes" Button Click - স্ক্রিনের কাউন্ট ০ হবে, কিন্তু হিস্ট্রিতে ডাটা সেভ থাকবে
    modalConfirm.addEventListener("click", function() {
      count = 0;
      countDisplay.innerText = count;
      resetCardStyle();
      customModal.classList.remove("active");
    });

    // Handle "No" Button Click
    modalCancel.addEventListener("click", function() {
      customModal.classList.remove("active");
    });

    function renderHistory() {
      historyList.innerHTML = "";
      let savedHistory = getStoredHistory();

      if (Object.keys(savedHistory).length === 0) {
        historyList.innerHTML = "<p style='text-align:center; padding:10px; color:#94a3b8;'>No history logged yet ✨</p>";
        return;
      }

      for (let date in savedHistory) {
        let dateHeader = document.createElement("div");
        dateHeader.className = "date-header";
        dateHeader.innerText = `📅 ${date}`;
        historyList.appendChild(dateHeader);

        let duasObj = savedHistory[date];

        for (let duaName in duasObj) {
          let duaCount = duasObj[duaName];

          let duaItem = document.createElement("div");
          duaItem.className = "dua-item";
          duaItem.innerHTML = `<span>✨ ${duaName}</span> <strong>${duaCount}</strong>`;
          
          duaItem.addEventListener("click", function() {
            duaSelect.value = duaName;
            loadCurrentDuaCount();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          historyList.appendChild(duaItem);
        }
      }
    }

    historyBtn.addEventListener("click", function() {
      if (historyCard.style.display === "block") {
        historyCard.style.display = "none";
      } else {
        historyCard.style.display = "block";
        renderHistory();
      }
    });
  </script>

</body>
</html>
