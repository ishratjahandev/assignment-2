<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbeeh Counter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0fdf4;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .card-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 350px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .dua-select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #16a34a;
      outline: none;
      margin-bottom: 10px;
      background-color: #f8fafc;
      font-weight: bold;
    }

    .count-display {
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-count {
      background-color: #16a34a;
      color: white;
      font-size: 22px;
      padding: 18px;
    }

    .btn-reset {
      background-color: #ef4444;
      color: white;
    }

    .btn-history {
      background-color: #0284c7;
      color: white;
    }

    .history-card {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 350px;
      display: none;
    }

    .history-card h3 {
      margin-bottom: 10px;
      font-size: 18px;
      text-align: center;
    }

    .history-list {
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
    }

    .date-header {
      background-color: #f1f5f9;
      padding: 6px 10px;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 14px;
    }

    .dua-item {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      border-bottom: 1px dashed #e2e8f0;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .dua-item:hover {
      background-color: #e0f2fe;
    }
  </style>
</head>
<body>

  <div class="card-container" id="card-container">
    <h1>Digital Tasbeeh Counter</h1>

    <select id="dua-select" class="dua-select">
      <option value="Subhanallah">Subhanallah</option>
      <option value="Alhamdulillah">Alhamdulillah</option>
      <option value="Allahu Akbar">Allahu Akbar</option>
      <option value="Astaghfirullah">Astaghfirullah</option>
      <option value="Durood">Durood</option>
    </select>

    <div class="count-display" id="count-display">0</div>

    <div class="btn-group">
      <button class="btn-count" id="count-btn">Count (+1)</button>
      <button class="btn-reset" id="reset-btn">Reset</button>
      <button class="btn-history" id="history-btn">📊 History</button>
    </div>
  </div>

  <div class="history-card" id="history-card">
    <h3>History (Click to view)</h3>
    <div class="history-list" id="history-list"></div>
  </div>

  <script>
    let count = 0;

    const countDisplay = document.getElementById("count-display");
    const countBtn = document.getElementById("count-btn");
    const resetBtn = document.getElementById("reset-btn");
    const historyBtn = document.getElementById("history-btn");
    const cardContainer = document.getElementById("card-container");
    const historyCard = document.getElementById("history-card");
    const historyList = document.getElementById("history-list");
    const duaSelect = document.getElementById("dua-select");

    const clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

    function getTodayDate() {
      const today = new Date();
      return today.toLocaleDateString('en-GB');
    }

    function getStoredHistory() {
      try {
        const data = localStorage.getItem("tasbeehDuaHistory");
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }

    function saveHistory(historyData) {
      try {
        localStorage.setItem("tasbeehDuaHistory", JSON.stringify(historyData));
      } catch (e) {
        console.error("Save error", e);
      }
    }

    // 🔄 সিলেক্ট করা দোয়ার আগের সেভড কাউন্ট লোড করা
    function loadCurrentDuaCount() {
      let todayDate = getTodayDate();
      let selectedDua = duaSelect.value;
      let savedHistory = getStoredHistory();

      if (savedHistory[todayDate] && savedHistory[todayDate][selectedDua]) {
        count = savedHistory[todayDate][selectedDua];
      } else {
        count = 0;
      }
      countDisplay.innerText = count;
      resetCardStyle();
    }

    function resetCardStyle() {
      cardContainer.style.backgroundColor = "#ffffff";
      cardContainer.style.color = "#000000";
    }

    loadCurrentDuaCount();

    // ➕ Count বাটন
    countBtn.addEventListener("click", function() {
      count = count + 1;
      countDisplay.innerText = count;

      let todayDate = getTodayDate();
      let selectedDua = duaSelect.value;
      let savedHistory = getStoredHistory();

      if (!savedHistory[todayDate]) {
        savedHistory[todayDate] = {};
      }

      savedHistory[todayDate][selectedDua] = count;
      saveHistory(savedHistory);

      let lastTwoDigits = count % 100;
      if (lastTwoDigits === 33 || lastTwoDigits === 66 || lastTwoDigits === 99) {
        clickSound.play();
        cardContainer.style.backgroundColor = "#22c55e";
        cardContainer.style.color = "#ffffff";
      } else {
        resetCardStyle();
      }
    });

    duaSelect.addEventListener("change", function() {
      loadCurrentDuaCount();
    });

    // 🔄 Reset বাটন
    resetBtn.addEventListener("click", function() {
      count = 0;
      countDisplay.innerText = count;
      resetCardStyle();
    });

    // 📊 হিস্ট্রি দেখান (আলাদা আলাদা জিকির সহ)
    function renderHistory() {
      historyList.innerHTML = "";
      let savedHistory = getStoredHistory();

      if (Object.keys(savedHistory).length === 0) {
        historyList.innerHTML = "<p style='text-align:center; padding:10px;'>No history found</p>";
        return;
      }

      for (let date in savedHistory) {
        let dateHeader = document.createElement("div");
        dateHeader.className = "date-header";
        dateHeader.innerText = `📅 ${date}`;
        historyList.appendChild(dateHeader);

        let duasObj = savedHistory[date];

        for (let duaName in duasObj) {
          let duaCount = duasObj[duaName];

          let duaItem = document.createElement("div");
          duaItem.className = "dua-item";
          duaItem.innerHTML = `<span>✨ ${duaName}</span> <strong>${duaCount} বার</strong>`;
          
          duaItem.addEventListener("click", function() {
            duaSelect.value = duaName;
            loadCurrentDuaCount();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });

          historyList.appendChild(duaItem);
        }
      }
    }

    historyBtn.addEventListener("click", function() {
      if (historyCard.style.display === "block") {
        historyCard.style.display = "none";
      } else {
        historyCard.style.display = "block";
        renderHistory();
      }
    });
  </script>

</body>
</html>
